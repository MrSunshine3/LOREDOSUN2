const u=(b.img||'').replace(/["'\\()\s]/g,'');$('#bgi').style.backgroundImage=u?'linear-gradient(rgba(5,5,12,.6),rgba(5,5,12,.6)),url("'+u+'")':'none'}
function bhtml(b){const x=fmt(b.x||'');
if(b.t=='f')return `<div class="bal${b.side=='r'?' r':''}">${b.who?'<b class="who">'+esc(b.who)+'</b>':''}${x}</div>`;
if(b.t=='p')return `<div class="pen">${x}</div>`;
if(b.t=='s')return `<div class="sis">${x}</div>`;
if(b.t=='e')return `<div class="efx">${x}</div>`;
return `<p class="tx">${x}</p>`}
function ctl(b,i){const T=[['t','Texto'],['f','Fala'],['p','Pensamento'],['s','Sistema'],['e','Efeito']];
return `<div class="ctl"><select data-f="t" data-i="${i}">${T.map(o=>`<option value="${o[0]}"${b.t==o[0]?' selected':''}>${o[1]}</option>`).join('')}</select>`+
(b.t=='f'?`<input data-f="who" data-i="${i}" placeholder="Quem fala" value="${esc(b.who||'')}"><select data-f="side" data-i="${i}"><option value="l">Esquerda</option><option value="r"${b.side=='r'?' selected':''}>Direita</option></select>`:'')+
`<input type="color" data-f="c1" data-i="${i}" value="${ok(b.c1,'#12151b')}"><input type="color" data-f="c2" data-i="${i}" value="${ok(b.c2,'#2b3340')}"><input data-f="img" data-i="${i}" placeholder="URL da imagem de fundo (opcional)" value="${esc(b.img||'')}">`+
`<button data-a="bup" data-i="${i}">▲</button><button data-a="bdn" data-i="${i}">▼</button><button data-a="bdel" data-i="${i}">✕</button></div><textarea data-f="x" data-i="${i}">${esc(b.x||'')}</textarea>`}
function watch(){io1&&io1.disconnect();io2&&io2.disconnect();const c=cur();
io1=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)bg(c.blocks[+e.target.dataset.i])}),{rootMargin:'-45% 0px -45% 0px'});
io2=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)e.target.classList.add('on')}),{threshold:.12});
document.querySelectorAll('.blk').forEach(n=>{io1.observe(n);io2.observe(n)});bg(c.blocks[0])}
function render(){
S.cur=Math.min(Math.max(S.cur||0,0),S.chs.length-1);const c=cur();
document.body.classList.toggle('edit',E);
$('#ttl').textContent=c.title;document.title=c.title||'Lore';
$('#tog').textContent=E?'👁 Ler':'✎ Editar';
$('#chs').innerHTML=S.chs.map((h,i)=>`<li class="${i==S.cur?'on':''}" data-i="${i}">${esc(h.title||'Sem título')}${E?`<span class="mv"><button data-a="up" data-i="${i}">▲</button><button data-a="dn" data-i="${i}">▼</button><button data-a="del" data-i="${i}">✕</button></span>`:''}</li>`).join('');
const inp=(f,p)=>`<input data-f="${f}" value="${esc(c[f]||'')}" placeholder="${p}">`;
let h='<header class="hero">';
if(E)h+=inp('note','Aviso pequeno no topo (opcional)')+inp('title','Título do capítulo')+inp('sub','Subtítulo')+inp('music','Link do YouTube para a música deste capítulo');
else h+=(c.note?`<div class="ia">${esc(c.note)}</div>`:'')+`<h1>${esc(c.title)}</h1><div class="sub">${esc(c.sub||'')}</div>`;
h+='</header>';
c.blocks.forEach((b,i)=>{h+=`<section class="blk" data-i="${i}">${E?ctl(b,i):''}<div class="pv">${bhtml(b)}</div></section>`});
h+=E?'<div class="addrow"><button data-a="addb">+ Bloco</button> <button data-a="paste">📋 Colar texto em blocos</button></div>':(S.cur<S.chs.length-1?'<div class="end"><button data-a="next">Próximo capítulo →</button></div>':'<div class="end">⚡ CONTINUA? ⚡</div>');
$('#view').innerHTML=h;watch()}
function yid(u){const m=(u||'').match(/(?:youtu\.be\/|v=|embed\/|shorts\/)([\w-]{11})/);return m?m[1]:null}
function music(){const f=$('#yt'),id=yid(cur().music);
if(playing&&id)f.src='https://www.youtube-nocookie.com/embed/'+id+'?autoplay=1&loop=1&playlist='+id;else f.removeAttribute('src');
$('#mbtn').textContent=playing&&id?'🔊':'🔈'}
const go=()=>{save();render();scrollTo(0,0);if(playing)music()};
function dl(n,t,m){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:m}));a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1e4)}
const sw=(arr,x,y)=>{if(y<0||y>=arr.length)return false;const t=arr[x];arr[x]=arr[y];arr[y]=t;return true};
document.addEventListener('input',e=>{const t=e.target,f=t.dataset.f;if(!f)return;const c=cur();
if(t.dataset.i===undefined){c[f]=t.value;if(f=='title'){const li=$('#chs li.on');if(li)li.firstChild.nodeValue=t.value||'Sem título';$('#ttl').textContent=t.value}save();return}
const b=c.blocks[+t.dataset.i];b[f]=t.value;save();
if(f=='t'){render();return}
t.closest('.blk').querySelector('.pv').innerHTML=bhtml(b);bg(b)});
document.addEventListener('change',e=>{if(e.target.dataset.f=='music'&&e.target.dataset.i===undefined)music()});
document.addEventListener('click',e=>{const t=e.target.closest('[data-a],#chs li');if(!t)return;
const a=t.dataset.a,i=+t.dataset.i,c=cur();
if(!a){S.cur=i;if(innerWidth<1000)document.body.classList.remove('menu');return go()}
if(a=='menu')document.body.classList.toggle('menu');
else if(a=='tog'){E=!E;render()}
else if(a=='music'){playing=!playing;if(playing&&!yid(c.music)){playing=false;alert('Este capítulo ainda não tem link do YouTube. Entre no modo ✎ Editar e cole o link no campo de música.')}music()}
else if(a=='next'){S.cur++;go()}
else if(a=='addch'){S.chs.push({id:uid(),title:'Novo capítulo',sub:'',music:'',note:'',blocks:[blank()]});S.cur=S.chs.length-1;go()}
else if(a=='up'||a=='dn'){const j=a=='up'?i-1:i+1;if(sw(S.chs,i,j)){if(S.cur==i)S.cur=j;else if(S.cur==j)S.cur=i;save();render()}}
else if(a=='del'){if(S.chs.length>1&&confirm('Excluir este capítulo?')){S.chs.splice(i,1);go()}}
else if(a=='bup'||a=='bdn'){if(sw(c.blocks,i,a=='bup'?i-1:i+1)){save();render()}}
else if(a=='bdel'){c.blocks.splice(i,1);save();render()}
else if(a=='addb'){c.blocks.push(blank(c.blocks[c.blocks.length-1]));save();render()}
else if(a=='paste')$('#dlg').showModal();
else if(a=='pno')$('#dlg').close();
else if(a=='pgo'){const last=c.blocks[c.blocks.length-1];
$('#pt').value.split(/\n\s*\n/).map(s=>s.trim()).filter(Boolean).forEach(s=>{const b=blank(last);b.x=s;c.blocks.push(b)});
$('#pt').value='';$('#dlg').close();save();render()}
else if(a=='exp')dl('lore-backup.json',JSON.stringify(S,null,1),'application/json');
else if(a=='site'){const j=JSON.stringify(S).replace(/</g,'\\u003c');
dl('index.html',SRC.replace(/(<script id="seed" type="application\/json">)[\s\S]*?(<\/script>)/,(m,x,y)=>x+j+y),'text/html')}
else if(a=='imp')$('#file').click()});
$('#file').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();
r.onload=()=>{try{const o=JSON.parse(r.result);if(!o.chs||!o.chs.length)throw 0;S=o;S.cur=0;save();render()}catch(x){alert('Arquivo de backup inválido.')}};
r.readAsText(f);e.target.value=''};
if(RO)document.body.classList.add('ro');
else if(innerWidth>=1000)document.body.classList.add('menu');
render();music();
})();
</script></body></html>
